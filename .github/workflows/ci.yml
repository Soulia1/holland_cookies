name: CI

# There was no CI in this repository before the pre-launch pass. Everything
# below already runs locally; this is what stops it from only running when
# somebody remembers.
#
# The ordering is deliberate: the cheap checks that fail most often run first,
# so a typo does not wait behind a fifteen-minute browser matrix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Browser matrices are
# slow and there is no value in finishing a run for a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never a real project. `backend/firestore.js` refuses to connect a
  # non-production process to a real Firestore, so a missing emulator here is a
  # hard failure rather than a silent write to live data.
  FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
  GCLOUD_PROJECT: holland-cookie-ci

jobs:
  static:
    name: lint, types, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` and not `npm install`: the lockfile is the input, and a build
      # that quietly resolves a different tree is not the build that was tested.
      - run: npm ci
      # The job was named for lint and never ran one.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A secret deleted from HEAD is still a leaked secret,
          # and scanning only the tip is how that gets missed.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only what actually ships. Dev tooling advisories are worth knowing but
      # are not a reason to block a release, and treating them as one is how a
      # team learns to ignore the whole check.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  emulated:
    name: backend, security and rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # spaRoutes.test.js serves the built storefront shell, so dist/ must exist.
      - run: npm run build
      # Starts the emulator, runs both suites inside its lifecycle, tears it
      # down. Includes the Firestore rules tests, which assert DENY.
      - name: Backend + security + rules
        run: npm run test:emulated

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # The Admin SDK must never reach a browser. Asserted against the built
      # output rather than the source, because that is where it would show up.
      - name: No Firebase or credentials in the client bundle
        run: |
          if grep -rlE 'firebase-admin|GrpcConnection|BEGIN PRIVATE KEY|service_account' dist dist-dashboard; then
            echo "::error::Firebase Admin SDK or a credential leaked into a client bundle"
            exit 1
          fi
          # Nothing from a development or test setup belongs on the production
          # path: a loopback API, the emulator, a test project or the e2e key.
          if grep -rlE '127\.0\.0\.1|localhost:[0-9]|FIRESTORE_EMULATOR|holland-cookie-(test|ci|e2e)|e2e-admin-key|ADMIN_KEY=' dist dist-dashboard; then
            echo "::error::a development endpoint, emulator or test credential is in a client bundle"
            exit 1
          fi
          echo "client bundles are clean"
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            dist-dashboard
          retention-days: 7

  e2e:
    name: end-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [static, build]
    strategy:
      fail-fast: false
      matrix:
        project:
          - commerce-chromium-desktop
          - commerce-chromium-phone
          - commerce-webkit-phone
          - commerce-webkit-desktop
          - storefront-chromium-desktop
          - storefront-chromium-phone
          - storefront-webkit-phone
          - storefront-webkit-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start Firestore emulator
        run: |
          npx firebase emulators:start --only firestore --project "$GCLOUD_PROJECT" &
          # A plain poll rather than `npx wait-on`, which would resolve and
          # install an unpinned package at CI time purely to sleep in a loop.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8080"; then
              echo "emulator ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Firestore emulator did not start within 60s"
          exit 1
      # No business API is mocked: a real browser against the real Express
      # server against a real (emulated) Firestore.
      - name: Playwright
        # data/ is gitignored, and the e2e server writes its log there.
        run: |
          mkdir -p data
          npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          # The server log as well as the traces: a trace shows what the browser
          # saw, and only the log shows what the server did about it.
          path: |
            test-results/
            data/e2e-server.log
          retention-days: 7

  # A single required check, so branch protection has one box to tick and a
  # skipped or cancelled job cannot be mistaken for a pass.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [static, secrets, dependencies, emulated, build, e2e]
    if: always()
    steps:
      # Each result is checked on its own. The previous version piped the joined
      # results into `grep -qvw success`, which inspects the *line*: any line
      # containing one "success" is filtered out, so a run with one failed job
      # and five green ones printed "all jobs succeeded" and passed this gate.
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::one or more jobs did not succeed: $RESULTS"
              exit 1
            fi
          done
          echo "all jobs succeeded"
